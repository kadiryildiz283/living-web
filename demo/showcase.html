<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Web — Showcase</title>
  <link rel="stylesheet" href="/index.html">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #ec4899;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo {
      font-size: 1.3rem; font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #6366f1, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    main { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
    .hero {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 1px solid #4338ca;
      border-radius: 0.75rem;
      padding: 2.2rem 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .hero h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .hero p { color: #cbd5e1; font-size: 1rem; margin-bottom: 1rem; }
    .toy-box {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(236, 72, 153, 0.2); border: 2px dashed #ec4899;
      color: #f472b6; padding: 0.5rem 1.2rem; border-radius: 9999px; font-weight: 600;
    }
    .obstacle-course {
      position: relative; height: 260px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem;
    }
    .obstacle-title { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .step-1 {
      position: absolute; left: 40px; top: 190px;
      width: 140px; height: 35px; background: #10b981;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: white;
    }
    .step-2 {
      position: absolute; left: 220px; top: 130px;
      width: 140px; height: 35px; background: #3b82f6;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: white;
    }
    .step-3 {
      position: absolute; left: 400px; top: 70px;
      width: 150px; height: 35px; background: #8b5cf6;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: white;
    }
    .step-4 {
      position: absolute; left: 590px; top: 120px;
      width: 150px; height: 35px; background: #f59e0b;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: white;
    }
  </style>
  <script src="/dist/living-web.global.js"></script>
</head>
<body>
  <header data-living-platform>
    <div class="logo">🐾 Living Web</div>
    <div style="font-size: 0.9rem; color: #94a3b8;">Autonomous Browser Agent Demo</div>
  </header>

  <main>
    <section class="hero" data-living-platform id="hero">
      <h1>Turn Any Website Into a Living World</h1>
      <p>Zero-physics autonomous game characters living directly on your DOM.</p>
      <div class="toy-box" data-living-attractor="squeaky-ball" id="ball">
        <span>🎾</span> Interactive Ball
      </div>
    </section>

    <section class="obstacle-course" data-living-platform id="staircase">
      <div class="obstacle-title">Staircase Obstacle Course (Smart Multi-Tier Navigation)</div>
      <div class="step-1" data-living-platform id="s1">Step 1 🟢</div>
      <div class="step-2" data-living-platform id="s2">Step 2 🔵</div>
      <div class="step-3" data-living-platform id="s3">Step 3 (Summit) 🟣</div>
      <div class="step-4" data-living-platform id="s4">Step 4 🟠</div>
    </section>
  </main>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const SDK = window.LivingWeb;
      const pet = SDK.createPet({
        name: "Boncuk",
        species: "dog",
        assets: "/pets/boncuk/",
        personality: { energy: 1.0, curiosity: 1.0, friendliness: 1.0, playfulness: 1.0 }
      });
      window.pet = pet;
      pet.start();

      // Choreographed showcase sequence
      // 0s: Hero Banner Walk & Greeting
      pet.teleport(200, 100);
      pet.setDirection(SDK.Direction.RIGHT);
      pet.walk();
      pet.say("Hav hav! Living Web'e hoş geldiniz! 🐾", 3000);

      // 2.2s: Jump across hero banner
      setTimeout(() => {
        pet.jump();
        pet.say("Hop! Engelleri aşıyorum! 🦘", 2500);
      }, 2200);

      // 4.0s: Teleport to Step 1 & Climb Staircase
      setTimeout(() => {
        const s1 = document.getElementById("s1");
        const rect = s1.getBoundingClientRect();
        pet.teleport(rect.left + 20, rect.top + window.scrollY - 55);
        pet.setDirection(SDK.Direction.RIGHT);
        pet.walk();
        pet.say("Merdiven parkurunu tırmanıyorum! 🧗", 3000);
      }, 4200);

      // 6.0s: Reached Summit
      setTimeout(() => {
        const s3 = document.getElementById("s3");
        const rect = s3.getBoundingClientRect();
        pet.teleport(rect.left + 40, rect.top + window.scrollY - 55);
        pet.setDirection(SDK.Direction.RIGHT);
        pet.say("Zirvedeyim! 🏆 Harika tırmanış!", 3500);
      }, 6200);
    });
  </script>
</body>
</html>
